<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YouTube Custom Looper</title>
    <link rel="stylesheet" type="text/css" href="style.css">
</head>
<body>

    <div class="container">
        <h1>YouTube Custom Looper</h1>

        <div class="input-group">
            <label for="videoUrl">YouTube Video URL:</label>
            <input type="text" id="videoUrl" placeholder="e.g., https://www.youtube.com/watch?v=your_video_id">
        </div>
        <button id="loadVideoBtn">Load Video</button>

        <div id="player-container">
             <div id="player"></div>
        </div>

        <div id="controls" style="display: none;">
            <p><strong>Define Loop Section:</strong></p>
            <div class="controls-row">
                <div class="input-group">
                    <label for="loopStart">Loop Start (seconds):</label>
                    <input type="number" id="loopStart" min="0" step="any" placeholder="e.g., 10.5">
                </div>
                <div class="input-group">
                    <label for="loopEnd">Loop End (seconds):</label>
                    <input type="number" id="loopEnd" min="0" step="any" placeholder="e.g., 25">
                </div>
                <div class="input-group">
                    <label for="loopType">Loop Behavior:</label>
                    <select id="loopType">
                        <option value="1">No Loop (Play Once)</option>
                        <option value="custom" selected>Loop X Times</option> <option value="infinite">Loop Forever</option>
                    </select>
                </div>
                <div class="input-group loop-count-group" id="loopCountGroup">
                     <label for="loopCountInput" id="loopCountLabel">Number of Loops:</label>
                     <input type="number" id="loopCountInput" min="1" step="1" value="3">
                 </div>

                <button id="playLoopBtn" disabled>Play Loop</button>
            </div>
        </div>

        <div id="error-message"></div>
    </div>

    <script src="script.js"></script>

</body>
</html>
